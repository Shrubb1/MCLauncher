plugins {
    // -remap variant: required for obfuscated versions (<= 1.21.11)
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = 'com.mclauncher'

base {
    archivesName = 'mclauncher-client'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // intentionally no fabric-api: everything is implemented with
    // plain mixins + vanilla APIs so the jar stays tiny and standalone
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// drop a stable-named copy next to the launcher data so the launcher can
// point -Dfabric.addMods at a fixed path
def copyToLauncher = tasks.register("copyToLauncher", Copy) {
    def appdata = System.getenv("APPDATA")
    if (appdata) {
        from("${buildDir}/libs") { include "mclauncher-client-*.jar"; rename { "mclauncher-client.jar" } }
        into("${appdata}/MCLauncher")
    }
}
tasks.named("build") { finalizedBy(copyToLauncher) }
