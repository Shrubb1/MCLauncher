plugins {
    // -remap variant: required for obfuscated versions (<= 1.21.11)
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = 'com.mclauncher'

base {
    archivesName = 'mclauncher-client-pro'
}

configurations {
    proguard
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // shared infra (settings, hud state) comes from the free jar at
    // runtime - compileOnly so it never lands inside this jar
    compileOnly files("${rootDir}/../client/build/libs/mclauncher-client-${project.mod_version}.jar")
    proguard "com.guardsquare:proguard-base:7.7.0"
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ProGuard's class pool needs a JDK's jmods or preverify can't resolve
// java.lang.Object when javac shares a local slot between unrelated
// reference types. Find a JDK anywhere on the machine; if nothing has
// jmods, download Temurin 21 once into .jdk21/ and use that.
def findJmods = {
    def homes = [System.getProperty("java.home"),
                 System.getenv("JAVA_HOME")]
    try { // the java on PATH may live somewhere we didn't scan
        def p = ["java", "-XshowSettings:properties", "-version"].execute()
        def err = p.err.text // drain BEFORE waitFor - a full pipe
                         // buffer deadlocks the child on write
        p.waitFor()
        def m = (err =~ /java\.home = (.+)/)
        if (m.find()) homes << m.group(1).trim()
    } catch (ignored) {
    }
    ["C:/Program Files/Eclipse Adoptium", "C:/Program Files/Java",
     "C:/Program Files/Microsoft", "C:/Program Files/Amazon Corretto",
     "C:/Program Files/Zulu",
     "${System.getProperty('user.home')}/.jdks",
     "${System.getProperty('user.home')}/jdk",
    ].each { root ->
        def r = new File(root)
        if (r.isDirectory()) {
            r.eachDir { d -> homes << d.absolutePath }
        }
    }
    homes.findAll { it != null }
         .collect { new File(it, "jmods") }
         .findAll { new File(it, "java.base.jmod").isFile() }
         .collectMany { it.listFiles().findAll {
             f -> f.name.endsWith(".jmod") } }
}

def provisionJmods = { File workDir ->
    def jmods = findJmods()
    if (!jmods.isEmpty()) {
        return jmods
    }
    // no JDK with jmods anywhere - fetch Temurin 21 once, cache it
    def os = System.getProperty("os.name").toLowerCase()
    def arch = System.getProperty("os.arch").toLowerCase()
    def plat = os.contains("win") ? "windows"
            : os.contains("mac") ? "mac" : "linux"
    def cpu = arch.contains("aarch64") || arch.contains("arm")
            ? "aarch64" : "x64"
    def url = "https://api.adoptium.net/v3/binary/latest/21/ga/" +
            "${plat}/${cpu}/jdk/hotspot/normal/eclipse"
    def cacheRoot = new File(workDir, ".jdk21")
    def cached = cacheRoot.listFiles()?.find {
        new File(it, "jmods/java.base.jmod").isFile()
    }
    if (cached == null) {
        def archive = new File(workDir, "build/temurin21" +
                (plat == "windows" ? ".zip" : ".tar.gz"))
        archive.parentFile.mkdirs()
        println "obfuscate: no local JDK has jmods - " +
                "downloading Temurin 21 (one-time)"
        ant.get(src: url, dest: archive, skipexisting: true)
        copy {
            plat == "windows" ? from(zipTree(archive))
                    : from(tarTree(resources.gzip(archive)))
            into(cacheRoot)
        }
        cached = cacheRoot.listFiles()?.find {
            new File(it, "jmods/java.base.jmod").isFile()
        }
    }
    if (cached == null) {
        throw new GradleException("obfuscate: couldn't provision a " +
                "JDK with jmods - set JAVA_HOME to a full JDK install")
    }
    new File(cached, "jmods").listFiles().findAll {
        it.name.endsWith(".jmod")
    }
}

// obfuscate the remapped jar: keeps the entrypoint + mixin names that
// jsons reference, renames everything else
def obf = tasks.register("obfuscate", JavaExec) {
    dependsOn tasks.named("remapJar")
    group = "build"
    def injar = tasks.named("remapJar").get().archiveFile.get().asFile
    inputs.file(injar)
    def outjar = layout.buildDirectory.file(
            "libs/mclauncher-client-pro-${project.version}-obf.jar").get().asFile
    outputs.file(outjar)
    classpath = configurations.proguard
    mainClass = "proguard.ProGuard"
    doFirst {
        def libjars = (sourceSets.main.compileClasspath.files
                + sourceSets.main.runtimeClasspath.files)
        // modular JDK has no rt.jar - find jmods anywhere, or download
        libjars += provisionJmods(rootDir)
        args = ["-injars", injar.path, "-outjars", outjar.path,
                "-libraryjars", libjars.join(File.pathSeparator),
                "@${rootDir}/proguard.conf"]
    }
}
tasks.named("build") { finalizedBy(obf) }

// drop a stable-named copy next to the launcher data
def copyToLauncher = tasks.register("copyToLauncher", Copy) {
    dependsOn obf
    doNotTrackState("game may hold session.lock")   // a running game holds session.lock - can't hash it
    def appdata = System.getenv("APPDATA")
    if (appdata) {
        from("${buildDir}/libs") { include "mclauncher-client-pro-*-obf.jar"; rename { "mclauncher-client-pro.jar" } }
        into("${appdata}/MCLauncher")
    }
}
tasks.named("build") { finalizedBy(copyToLauncher) }
