# Paid-tier obfuscation. Free jar ships un-obfuscated - nothing to steal.

# referenced by name inside fabric.mod.json / mixins.json
-keep class com.mclauncher.pro.ProMod
-keep class com.mclauncher.pro.mixin.** { *; }

# mixin internals reference these by annotation strings
-keepclassmembers class * {
    @org.spongepowered.asm.mixin.gen.Accessor *;
    @org.spongepowered.asm.mixin.gen.Invoker *;
}

-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions
-keepparameternames
-dontnote **
-dontwarn **
-allowaccessmodification
-repackageclasses o
-flattenpackagehierarchy f
